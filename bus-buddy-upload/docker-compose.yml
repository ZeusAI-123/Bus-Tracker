
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      
      - ZETARIS_REST_URL=${ZETARIS_REST_URL_DOCKER:-http://host.docker.internal:8888/api/v1.0}
      - METERLESS_BASE_URL=${METERLESS_BASE_URL_DOCKER:-http://host.docker.internal:8088/v1}
    extra_hosts: ["host.docker.internal:host-gateway"]

  postgres:
    image: postgres:16
    profiles: ["db"]
    environment:
      POSTGRES_DB: busbuddy
      POSTGRES_USER: busbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes:
      - ./data/sample:/data/sample:ro
      - ./scripts/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
